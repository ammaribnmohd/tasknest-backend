spring.application.name=taskflow-backend
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# --- Optional local secrets file -------------------------------------------------
# Spring Boot does NOT load .env automatically. This line makes it explicit: if a
# file named ".env" (KEY=VALUE lines) exists in the working directory, it is loaded.
# Real environment variables always take precedence. ".env" is git-ignored.
spring.config.import=optional:file:.env[.properties]

# --- MongoDB (Spring Boot 4 property names) --------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/taskflow}
# Without this, @Indexed / unique indexes are NOT created in Spring Data MongoDB.
spring.data.mongodb.auto-index-creation=true

# --- Session cookie (server-side session, HttpOnly) -------------------------------
server.servlet.session.cookie.name=TASKFLOW_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
# Set SESSION_COOKIE_SECURE=true in production (HTTPS only).
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# --- Brevo SMTP (credentials come from environment variables only) ----------------
spring.mail.host=smtp-relay.brevo.com
# Render's free tier blocks outbound 25/465/587 -> set MAIL_PORT=2525 there (Brevo supports it).
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Application settings ---------------------------------------------------------
app.mail.from=${MAIL_FROM:}
app.mail.from-name=Taskflow

app.otp.expiry-minutes=10
app.otp.resend-cooldown-seconds=60
app.otp.max-attempts=5
# HMAC key used to hash OTPs before storing. Set a long random value via OTP_HMAC_SECRET.
app.otp.hmac-secret=${OTP_HMAC_SECRET:dev-only-insecure-secret-change-me}

# Browser origins allowed to call the API with credentials (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.rate-limit.login-max=5
app.rate-limit.login-window-minutes=15
app.rate-limit.otp-verify-max=10
app.rate-limit.otp-verify-window-minutes=15
app.rate-limit.otp-request-max=5
app.rate-limit.otp-request-window-minutes=15
